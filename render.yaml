services:
  - type: web
    name: pvscan
    env: python
    plan: free
    buildCommand: |
      # --- Build frontend ---
      cd pvscan-frontend-vite
      npm install
      npm run build

      # --- Copy Vue build into backend/static ---
      rm -rf ../src/static/*
      cp -r dist/* ../src/static/

      # --- Install Python deps ---
      pip install --upgrade pip
      pip install -r requirements.txt

    startCommand: gunicorn --workers 4 --bind 0.0.0.0:$PORT src.main:app

    envVars:
      - key: SECRET_KEY
        generateValue: true
