services:
  - type: web
    name: pvscan
    env: python
    plan: free
    cache:
      - name: pip-cache
        path: /opt/render/project/.pip_cache
    buildCommand: |
      # --- Build frontend ---
      cd pvscan-frontend-vite
      npm install
      npm run build

      # --- Copy Vite build into backend ---
      cd ..
      cp -r pvscan-frontend-vite/dist/assets src/static/
      cp pvscan-frontend-vite/dist/logo_comp.png src/static/
      cp pvscan-frontend-vite/dist/logo_phone.png src/static/
      cp pvscan-frontend-vite/dist/favicon.ico src/static/
      cp pvscan-frontend-vite/dist/index.html src/templates/

      # --- Install Python deps ---
      pip install -r requirements.txt

    startCommand: gunicorn --workers 4 --bind 0.0.0.0:$PORT src.main:app

    envVars:
      - key: SECRET_KEY
        generateValue: true
